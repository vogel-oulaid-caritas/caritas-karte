<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Testversion - Caritasverband Trier - Einrichtungen</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Marker Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <!-- Eigene CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Testversion - Einrichtungen des Caritasverband Trier</h1>

  <div class="controls">
    <input
      type="text"
      id="searchInput"
      placeholder="Einrichtung, Kategorie oder Adresse suchen...">

    <div id="categoryButtons"></div>
  </div>

<div class="map-list-layout">

  <div id="einrichtungenListe"></div>

  <div id="map"></div>

</div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Marker Cluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- PapaParse für CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Eigener Code -->
  <script src="script.js"></script>

</body>
</html>
